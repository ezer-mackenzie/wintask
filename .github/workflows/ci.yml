# Based on maturin output; preserve custom validation and wheel tests when updating.
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-15-intel]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: cargo fmt --check
      - run: uv run python -m unittest discover -s tests -v

  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYO3_PYTHON = python -c "import sys; print(sys.executable)"
          cargo +1.85.0 check --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.9"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.10"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.11"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.12"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.13"
          - runner: windows-latest
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.14"
          - runner: windows-2022
            target: x64
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python: "3.13"
          - runner: windows-latest
            target: x86
            rust_target: i686-pc-windows-msvc
            python_arch: x86
            python: "3.13"
          - runner: windows-11-arm
            target: aarch64
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test native error mapping
        run: |
          $env:PYO3_PYTHON = python -c "import sys; print(sys.executable)"
          cargo test --locked --target ${{ matrix.rust_target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate wheel contents
        run: python tools/validate_distribution.py dist
      - name: Test installed Windows wheel
        env:
          WINTASK_INTEGRATION: "1"
        run: |
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist wintask
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload wheels
        if: matrix.runner != 'windows-2022'
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check distribution metadata
        run: |
          uv sync --locked --group release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --group release python -m twine check --strict dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_distribution.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild and test source distribution
        env:
          WINTASK_INTEGRATION: "1"
        run: |
          $source = @(Get-ChildItem dist/*.tar.gz)
          if ($source.Count -ne 1) { throw "Expected one source distribution" }
          python -m pip wheel --no-deps --wheel-dir rebuilt $source[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_distribution.py rebuilt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --force-reinstall --no-deps --no-index --find-links rebuilt wintask
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
